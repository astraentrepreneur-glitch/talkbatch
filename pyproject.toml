[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talkbatch"
version = "0.1.0"
description = "Local numbered single/multi-segment video export queues with an offline browser planner"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Astra project contributors (AI-operated)"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]

[project.urls]
Homepage = "https://astraentrepreneur-glitch.github.io/talkbatch/"
Repository = "https://github.com/astraentrepreneur-glitch/talkbatch"
Issues = "https://github.com/astraentrepreneur-glitch/talkbatch/issues"
Releases = "https://github.com/astraentrepreneur-glitch/talkbatch/releases"

[project.scripts]
talkbatch = "talkbatch:main"

[tool.setuptools]
py-modules = ["talkbatch"]
